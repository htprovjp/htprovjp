<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465">

<defs>
  <!-- Hiệu ứng dải màu chuyển động áp dụng cho TẤT CẢ các dòng chữ -->
  <linearGradient id="g-moving" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#86efac"></stop>
    <stop offset="35%" stop-color="#86efac"></stop>
    <stop offset="50%" stop-color="#ffffff"></stop> <!-- Vệt sáng trắng quét qua -->
    <stop offset="65%" stop-color="#86efac"></stop>
    <stop offset="100%" stop-color="#86efac"></stop>
    
    <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite" />
  </linearGradient>
</defs>

<!-- Lớp nền xanh nước biển đậm giúp bảo vệ chữ, không lo bị tàng hình ở giao diện trắng -->
<rect width="100%" height="100%" fill="#1a365d" rx="12" />

<!-- Tiêu đề chính -->
<text x="450" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="url(#g-moving)">ﮩ٨ـﮩﮩ٨ـ 𝔸𝔹𝕆𝕌𝕋 𝕄𝔼 ﮩ٨ـﮩﮩ٨ـ</text>

<!-- Nội dung phần giới thiệu (Tất cả đều dùng chung hiệu ứng quét sáng fill="url(#g-moving)") -->
<text x="450" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖧𝖤𝖫𝖫𝖮! 𝖨'𝖬 HAMISH 𝖩𝖴𝖲𝖳 𝖠 𝖢𝖮𝖹𝖸 𝖲𝖮𝖴𝖫 𝖧𝖤𝖱𝖤 𝖦𝖱𝖤𝖤𝖳𝖨𝖭𝖦 𝖸𝖮𝖴.</text>

<text x="450" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖸𝖮𝖴 𝖢𝖠𝖫𝖲𝖮 𝖢𝖠𝖫𝖫 𝖬𝖤 NOXISH OR NOX 𝖨𝖥 𝖸𝖮𝖴 𝖫𝖨𝖪𝖤 (*´𝗏x𝗏*)</text>

<text x="450" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖨'𝖬 𝖰𝖴𝖨𝖳𝖤 𝖲𝖧𝖸 𝖠𝖳 𝖥𝖨𝖱𝖲𝖳, 𝖡𝖴𝖳 𝖨'𝖫𝖫 𝖡𝖤 𝖠 𝖫𝖨𝖳𝖳𝖫𝖤 𝖫𝖮𝖴𝖣𝖤𝖱 𝖮𝖭𝖢𝖤 𝖶𝖤 𝖦𝖤𝖳 𝖢𝖫𝖮𝖲𝖤𝖱 :𝖣</text>

<text x="450" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖨'𝖬 𝖠 𝖡𝖨𝖳 𝖫𝖠𝖹𝖸 𝖠𝖭𝖣 𝖰𝖴𝖨𝖤𝖳</text>

<text x="450" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖨'𝖬 𝖰𝖴𝖨𝖳𝖤 𝖠𝖭 𝖨𝖭𝖳𝖱𝖮𝖵𝖤𝖱𝖳, 𝖡𝖴𝖳 𝖠𝖫𝖶𝖠𝖸𝖲 𝖧𝖤𝖱𝖤 𝖳𝖮 𝖫𝖨𝖲𝖳𝖤𝖭 𝖨𝖥 𝖸𝖮𝖴 𝖭𝖤𝖤𝖣 𝖠 𝖢𝖧𝖤𝖳 𝖳𝖦ᵕ̈</text>

<text x="450" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-style="italic" fill="url(#g-moving)">𖤓 To be honest, I don't really mind what you call me, you can even make up a nickname for me if you'd like! 𖤓</text>

<text x="450" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-style="italic" fill="url(#g-moving)">𝖥𝖠𝖭𝖣𝖮𝖬𝖲 : 𝖦𝖨𝖭𝖳𝖮𝖪𝖨 &amp; 𝖳𝖧𝖤 𝖦𝖨𝖭𝖳𝖠𝖬𝖠 𝖢𝖱𝖤𝖶 /ᐠ. ｡.ᐟ\ᵐᵉᵒʷˎˊ˗</text>

<!-- Đường phân cách lấp lánh (Đã đẩy lui xuống dưới để nhường chỗ cho khối văn bản dài) -->
<text x="450" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="url(#g-moving)">─────── ✦ ───────</text>

<text x="450" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="url(#g-moving)">✮ 𝖢𝖴𝖱𝖱𝖤𝖭𝖳 𝖮𝖡𝖲𝖤𝖲𝖲𝖨𝖮𝖭 / 𝖮𝖳𝖯 : 
𝐒𝐀𝐊𝐀𝐓𝐀 𝐆𝐈𝐍𝐓𝐎𝐊𝐈 𝐱 𝐇𝐈𝐉𝐈𝐊𝐀𝐓𝐀 𝐓𝐎𝐔𝐒𝐇𝐈𝐑𝐎𝐔 / 𝐆𝐈𝐍𝐇𝐈𝐉𝐈 / 𝐎𝐊𝐈𝐊𝐀𝐆𝐔(𝖳𝖧𝖤𝖸 𝖠𝖱𝖤 𝖬𝖸 𝖫𝖨𝖥𝖤 𝖫𝖨𝖭𝖤 🥺, ESPECIALLY 𝐆𝐈𝐍𝐇𝐈𝐉𝐈 I ABSOLUTELY LOVE THEM.) </text>

<text x="450" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="url(#g-moving)"></text>

<!-- Phần chú thích ghi công nhỏ -->
<text x="450" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-style="italic" fill="url(#g-moving)">(𝑎𝑟𝑡𝑤𝑜𝑟𝑘𝑠 𝑎𝑛𝑑 𝑔𝑖𝑓 ℎ𝑒𝑟𝑒 𝑎𝑟𝑒 𝑛𝑜𝑡 𝑚𝑖𝑛𝑒 — 𝑖𝑚 𝑗𝑢𝑠𝑡 𝑒𝑑𝑖𝑡𝑒𝑑 𝑡ℎ𝑒𝑚</text>

<text x="450" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-style="italic" fill="url(#g-moving)">𝑎𝑙𝑠𝑜 𝑓𝑟𝑜𝑚 𝑡𝑖𝑘𝑡𝑜𝑘 𝑎𝑛𝑑 𝑝𝑖𝑛)</text>

<!-- Đường phân cách lấp lánh -->
<text x="450" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="url(#g-moving)">─────── ✦ ───────</text>

<!-- Phần Note -->
<text x="450" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="url(#g-moving)">🖇️ 𝐍𝟎𝐓𝟑 ✩</text>

<text x="450" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="url(#g-moving)">♱ 𝐍𝟎𝐓 𝐒𝐔𝐏𝐏𝟎𝐑𝐓 𝐂𝟎𝐏𝐘 𝐌𝐘 𝐒𝐊𝟏𝐍 / 𝐈𝐃𝟑𝟒𝐒 𝐖𝟏𝐓𝐇𝟎𝐔𝐓 𝐏𝟑𝐑𝐌𝟏𝐒𝐒𝟏𝟎𝐍</text>

<text x="450" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="url(#g-moving)">♱ 𝐍𝟎𝐓 𝐒𝐔𝐏𝐏𝟎𝐑𝐓 𝐑𝟒𝐂𝟏𝐒𝐓, 𝐑𝟎𝐋𝟑𝐏𝐋𝟒𝐘, 𝐏𝐑𝟎𝐒𝐇𝐈𝐏/𝐃𝟒𝐑𝐊𝐒𝐇𝐈𝐏, 𝟏𝐍𝐒𝟑🇨🇹🇺𝐎𝐒</text>

<!-- Thanh ngang dưới cùng -->
<rect x="245" y="445" width="410" height="2" rx="1" fill="url(#g-moving)" opacity=".9"></rect>

</svg>
