<svg width="1200" height="70" viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">

<!-- LỚP NỀN RECT ĐÃ ĐƯỢC XÓA BỎ ĐỂ NỀN HOÀN TOÀN TRONG SUỐT -->

<!-- sparkle 1: Lấp lánh lệch nhịp chậm (2.4s) - Đổi sang màu xanh lá đậm -->
<circle cx="70" cy="20" r="2.5" fill="#14532d">
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"></animate>
</circle>

<!-- sparkle 2: Thêm một ngôi sao ở giữa để cân bằng bố cục (1.8s) - Đổi sang màu xanh lá đậm -->
<circle cx="600" cy="15" r="2" fill="#14532d">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"></animate>
</circle>

<!-- sparkle 3: Lấp lánh lệch nhịp nhanh (1.2s) - Đổi sang màu xanh lá đậm -->
<circle cx="1120" cy="50" r="3" fill="#14532d">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"></animate>
</circle>

<!-- Logic chữ chạy vô hạn: Giữ nguyên khoảng cách tịnh tiến và đổi màu chữ thành xanh lá đậm -->
<text x="0" y="45" font-size="30" font-family="monospace" font-weight="700" fill="#14532d">

 »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »»

<animateTransform attributeName="transform" type="translate" from="0 0" to="-1320 0" dur="14s" repeatCount="indefinite"></animateTransform>

</text>

</svg>
