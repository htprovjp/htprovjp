<svg width="1200" height="70" viewBox="0 0 1200 70" xmlns="http://w3.org">

<defs>
  <!-- Giải pháp Pattern: Tạo dải màu đan xen Xanh lá đậm và Trắng khớp chính xác theo từng cụm chữ -->
  <pattern id="green-white-stripes" x="0" y="0" width="330" height="70" patternUnits="userSpaceOnUse">
    <!-- Cụm 1: Xanh lá đậm -->
    <rect x="0" y="0" width="165" height="70" fill="#14532d" />
    <!-- Cụm 2: Trắng -->
    <rect x="165" y="0" width="165" height="70" fill="#ffffff" />
  </pattern>

  <!-- Hiệu ứng bóng đổ nhẹ giúp chữ màu trắng hiển thị rõ trên mọi nền sáng -->
  <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#14532d" flood-opacity="0.3"/>
  </filter>
</defs>

<!-- NỀN HOÀN TOÀN TRONG SUỐT (ĐÃ XÓA RECT NỀN CŨ) -->

<!-- Các ngôi sao lấp lánh giữ nguyên màu trắng chuyển động nguyên bản -->
<circle cx="70" cy="20" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"></animate>
</circle>

<circle cx="600" cy="15" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"></animate>
</circle>

<circle cx="1120" cy="50" r="3" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"></animate>
</circle>

<!-- Cấu trúc chữ chạy VẸN NGUYÊN 100% như code gốc của bạn, sử dụng fill pattern để đan xen màu sắc -->
<text x="0" y="45" font-size="30" font-family="monospace" font-weight="700" fill="url(#green-white-stripes)" filter="url(#text-shadow)">

 »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »» hello i'm hamish  »»



</svg>
