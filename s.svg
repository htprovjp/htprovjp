<svg width="1200" height="70" viewBox="0 0 1200 70" xmlns="http://w3.org">

<defs>
  <!-- 1. Hiệu ứng đổ bóng nhấp nháy (Glow/Drop Shadow) cho phần Text -->
  <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#14532d" flood-opacity="0.6">
      <animate attributeName="flood-opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" />
    </feDropShadow>
  </filter>

  <!-- 2. Hiệu ứng co giãn nhẹ nhàng (Pulse) áp dụng trực tiếp vào cấu trúc Text -->
  <animateTransform id="pulse-effect" attributeName="transform" type="scale" values="1; 1.02; 1" dur="2s" repeatCount="indefinite" additive="sum" />
</defs>

<!-- LỚP NỀN TRONG SUỐT -->

<!-- Các ngôi sao lấp lánh nguyên bản -->
<circle cx="70" cy="20" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"></animate>
</circle>

<circle cx="600" cy="15" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"></animate>
</circle>

<circle cx="1120" cy="50" r="3" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"></animate>
</circle>

<!-- Logic chữ chạy vô hạn tích hợp các hiệu ứng mới và màu sắc đan xen -->
<text x="0" y="45" font-size="30" font-family="monospace" font-weight="700" filter="url(#text-glow)">

  <!-- Cụm 1 -->
  <tspan fill="#14532d"> »» hello i'm hamish </tspan>
  <tspan fill="#ffffff"> »» hello i'm hamish </tspan>
  
  <!-- Cụm 2 -->
  <tspan fill="#14532d"> »» hello i'm hamish </tspan>
  <tspan fill="#ffffff"> »» hello i'm hamish </tspan>
  
  <!-- Cụm 3 -->
  <tspan fill="#14532d"> »» hello i'm hamish </tspan>
  <tspan fill="#ffffff"> »» hello i'm hamish </tspan>
  
  <!-- Cụm 4 -->
  <tspan fill="#14532d"> »» hello i'm hamish </tspan>
  <tspan fill="#ffffff"> »» hello i'm hamish </tspan> »»

  <!-- Hiệu ứng chạy chữ vô hạn kết hợp co giãn nhịp tim -->
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-1320 0" dur="14s" repeatCount="indefinite" />

</text>

</svg>
