<svg width="1200" height="70" viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">

<rect width="1200" height="70" rx="10" fill="#2ea44f"></rect>

<!-- sparkle (ngôi sao lấp lánh) -->
<circle cx="70" cy="20" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"></animate>
</circle>

<circle cx="1120" cy="50" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1.7s" repeatCount="indefinite"></animate>
</circle>
 <!-- Chữ màu trắng chạy ngang -->
<text x="0" y="45" font-size="30" font-family="monospace" font-weight="700" fill="#ffffff">

✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦ welcome ✦

<animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"></animateTransform>

</text>

</svg>
